version: 2
updates:
  # Keep GitHub Actions pinned to latest SHA-tagged versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let new releases bake before opening a PR (supply-chain hardening).
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        patterns: ["*"]
    labels:
      - dependencies
      - github-actions

  # Keep Go modules up to date.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go-minor:
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - go

  # bench/ is its own module (stdlib-only today, so this usually stays quiet).
  - package-ecosystem: gomod
    directory: /bench
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go-minor:
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - go

  # Keep the Dockerfile's builder and runtime base images up to date.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns: ["*"]
    labels:
      - dependencies
      - docker

  # Keep the documentation website (Docusaurus) dependencies up to date.
  # Group everything into a single PR so transitive security bumps land
  # together instead of one PR per package.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      website-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      website-security:
        applies-to: security-updates
        patterns: ["*"]
    labels:
      - dependencies
      - website
