# Maestra fork: build the Dockerfile and push to the maestra ECR (us-west-2).
# Copied from maestra-io/mcp-victorialogs build-and-push-ecr.yml; no release
# numbering here (IMAGE_VERSION below is bumped by hand) and no secondary-ECR
# mirror. Needs Teleport token image-push-github-actions-loki-vl-proxy
# (maestra-io/fluxcd#14268).
name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One publish at a time: parallel runs race on create-repository and on the
# `latest` tag; the newest commit wins.
concurrency:
  group: ecr-publish-loki-vl-proxy
  cancel-in-progress: true

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  AWS_REGION: us-west-2
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-loki-vl-proxy
  AWS_ROLE_ARN: "arn:aws:iam::515260921971:role/teleport-image-push"
  IMAGE_NAME: loki-vl-proxy
  # <upstream tag without the v>-maestra.<fork revision>. Bump the left half on
  # every rebase onto a new upstream tag, the right half on every fork-only
  # change. Quoted: an unquoted version scalar is a YAML float trap.
  IMAGE_VERSION: "1.81.0-maestra.7"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git operations downstream — don't leave a `GITHUB_TOKEN`
          # in `.git/config` for the rest of the job to find.
          persist-credentials: false
          # History for the check below: it diffs against the commit that
          # published IMAGE_VERSION.
          fetch-depth: 0

      - name: Get Teleport version
        id: tp-version
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to resolve Teleport version from /webapi/find"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Teleport
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: ECR login via Teleport Workload Identity
        run: |
          cat > /tmp/tbot.yaml << EOF_TBOT
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF_TBOT

          mkdir -p /tmp/tbot-output
          tbot start -c /tmp/tbot.yaml

          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${{ env.AWS_ROLE_ARN }}"
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}

          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login ${{ env.ECR_REGISTRY }} --username AWS --password-stdin

          # Image-build ECR repositories are not terraform-managed (aws-infra
          # ecr-eu-forget.tf: "the rest were only ever created by CI pushes");
          # the registry-wide scanning config already covers them.
          # IMAGE_VERSION and the sha tag are immutable: a release tag must never be
          # silently overwritten (2026-10-09: GitLab re-minted release numbers after a
          # restore and CI overwrote released images), so a change pushed without an
          # IMAGE_VERSION bump fails the push. `latest` is moving, so it is excluded.
          aws ecr describe-repositories --repository-names ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} \
            --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
            --image-tag-mutability-exclusion-filters 'filterType=WILDCARD,filter=latest'

          # Org-wide pull policy, the same one push-to-aws-ecr-repository and
          # the aws-infra pull-through templates apply. Without it the
          # repository is readable only from the registry's own account:
          # us-omega/us-omicron pull through a mirror with an infra-account
          # credential and never noticed, but the EU AWS clusters (their own
          # accounts, node IAM role) got 403 on every pull (issues-maestra#1031,
          # 2026-09-16). Set on every run, not only on create — the repository
          # already existed without it.
          aws ecr set-repository-policy --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} \
            --policy-text file://.github/ecr-policy.json >/dev/null

      # IMAGE_VERSION is immutable in ECR. A push that changes nothing in the image
      # (website/, docs, this workflow) ends here instead of failing on the existing
      # tag. A push that changes the image without a bump still fails, with that
      # message. Inputs: what the two binaries are built from (go build skips *_test.go)
      # and .dockerignore, which shapes the COPY . . context.
      - name: Check IMAGE_VERSION against ECR
        id: version
        env:
          AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/tbot-output/jwt_svid
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          tags=$(aws ecr describe-images --repository-name "$IMAGE_NAME" \
            --image-ids imageTag="$IMAGE_VERSION" --query 'imageDetails[0].imageTags' \
            --output text 2>/tmp/describe.err) || {
            grep -q ImageNotFoundException /tmp/describe.err || { cat /tmp/describe.err; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          published=$(tr '\t' '\n' <<< "$tags" | grep -xE '[0-9a-f]{12}' | head -1 || true)
          if [ -n "$published" ] && git rev-parse -q --verify "$published^{commit}" >/dev/null &&
            git diff --quiet "$published" HEAD -- Dockerfile .dockerignore go.mod go.sum '*.go' ':!*_test.go'; then
            echo "::notice::$IMAGE_VERSION is already in ECR from $published and the image inputs are unchanged: nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$IMAGE_VERSION is already in ECR (from ${published:-an unknown commit}) and the image inputs changed since: bump IMAGE_VERSION"
          exit 1

      # BuildKit pulls the base images through nora (packages.maestra.io, issues-maestra#1649)
      # with ~/.docker/config.json. nora takes the GitHub OIDC token, which lives minutes: a
      # credential helper mints a fresh one per pull. Same step as dotnet-service-build.yml in
      # maestra-io/github-actions.
      - name: nora docker credentials
        env:
          AUDIENCE: packages.maestra.io
          PACKAGES_URL: https://packages.maestra.io
        run: |
          # >>> nora-cred-helper (copy of maestra-io/github-actions dotnet-service-build.yml)
          bin="$RUNNER_TEMP/nora-bin"; mkdir -p "$bin"
          # The helper runs in the caller's environment, which tox and other test runners
          # scrub: the job's OIDC request URL and token go to a 0600 file next to it.
          ( umask 077; printf 'url=%q\ntoken=%q\naud=%q\n' "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$AUDIENCE" > "$bin/oidc.env" )
          cat > "$bin/docker-credential-nora" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [ "${1:-}" = get ] || exit 0
          server=$(cat) # docker sends it without a newline
          . "${BASH_SOURCE[0]%/*}/oidc.env"
          t=$(curl -sSf --retry 3 --connect-timeout 10 --max-time 30 -H "Authorization: bearer $token" \
            "$url&audience=$aud" | jq -r '.value // empty')
          [ -n "$t" ]
          jq -cn --arg s "$server" --arg t "$t" '{ServerURL: $s, Username: "token", Secret: $t}'
          EOF
          chmod 755 "$bin/docker-credential-nora"
          echo "$bin" >> "$GITHUB_PATH"
          host="${PACKAGES_URL#*://}"; host="${host%%/*}"
          cfg="${DOCKER_CONFIG:-$HOME/.docker}/config.json"; mkdir -p "$(dirname "$cfg")"
          [ -s "$cfg" ] || echo '{}' > "$cfg"
          jq --arg h "$host" '.credHelpers[$h] = "nora"' "$cfg" > "$cfg.t" && mv "$cfg.t" "$cfg"
          # <<< nora-cred-helper

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.version.outputs.publish == 'true'

      # Right before the build: the Docker secret carries a token minted here.
      - name: go modules through nora
        if: steps.version.outputs.publish == 'true'
        id: nora
        uses: maestra-io/github-actions/go-nora@be3edebf65de183a5a0c3b02bcc0cd064198cdf5 # v1.62.4

      - name: Build metadata
        if: steps.version.outputs.publish == 'true'
        id: meta
        run: |
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # BuildKit pushes only the layers ECR is missing; `docker push` from a
      # fresh daemon re-uploaded every layer of every release.
      - name: Build and push
        if: steps.version.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Same scope as the ci.yaml builds of this Dockerfile. Caches written on main
          # (ci.yaml on push and this release) are shared; a PR's cache stays with that PR.
          cache-from: type=gha,scope=e2e-proxy
          cache-to: type=gha,mode=max,scope=e2e-proxy,ignore-error=true
          secrets: |
            PRIVATE_PACKAGES_TOKEN=${{ steps.nora.outputs.token }}

      # Re-mint the tbot JWT (5 min TTL): a cold-cache build can outlive the one
      # from the ECR login step. Best-effort, like the signing itself.
      - name: Refresh workload identity JWT
        if: steps.version.outputs.publish == 'true'
        continue-on-error: true
        run: tbot start -c /tmp/tbot.yaml

      # The ECR login step's AWS exports die with it; the tbot JWT file stays.
      - name: Sign image + attest SBOM
        if: steps.version.outputs.publish == 'true'
        uses: maestra-io/github-actions/sign-image@bdfea43a7d47149012fa1a488c91e5d6a49b2744 # v1.62.2
        env:
          AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/tbot-output/jwt_svid
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        with:
          image: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
