# Maestra fork: build the Dockerfile and push to the maestra ECR (us-west-2).
# Copied from maestra-io/mcp-victorialogs build-and-push-ecr.yml; no release
# numbering here (IMAGE_VERSION below is bumped by hand) and no secondary-ECR
# mirror. Needs Teleport token image-push-github-actions-loki-vl-proxy
# (maestra-io/fluxcd#14268).
name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One publish at a time: parallel runs race on create-repository and on the
# `latest` tag; the newest commit wins.
concurrency:
  group: ecr-publish-loki-vl-proxy
  cancel-in-progress: true

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  AWS_REGION: us-west-2
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-loki-vl-proxy
  AWS_ROLE_ARN: "arn:aws:iam::515260921971:role/teleport-image-push"
  IMAGE_NAME: loki-vl-proxy
  # <upstream tag without the v>-maestra.<fork revision>. Bump the left half on
  # every rebase onto a new upstream tag, the right half on every fork-only
  # change. Quoted: an unquoted version scalar is a YAML float trap.
  IMAGE_VERSION: "1.81.0-maestra.3"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git operations downstream — don't leave a `GITHUB_TOKEN`
          # in `.git/config` for the rest of the job to find.
          persist-credentials: false

      - name: Get Teleport version
        id: tp-version
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to resolve Teleport version from /webapi/find"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Teleport
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: ECR login via Teleport Workload Identity
        run: |
          cat > /tmp/tbot.yaml << EOF_TBOT
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF_TBOT

          mkdir -p /tmp/tbot-output
          tbot start -c /tmp/tbot.yaml

          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${{ env.AWS_ROLE_ARN }}"
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}

          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login ${{ env.ECR_REGISTRY }} --username AWS --password-stdin

          # Image-build ECR repositories are not terraform-managed (aws-infra
          # ecr-eu-forget.tf: "the rest were only ever created by CI pushes");
          # the registry-wide scanning config already covers them.
          # IMAGE_VERSION and the sha tag are immutable: a release tag must never be
          # silently overwritten (2026-10-09: GitLab re-minted release numbers after a
          # restore and CI overwrote released images), so a change pushed without an
          # IMAGE_VERSION bump fails the push. `latest` is moving, so it is excluded.
          aws ecr describe-repositories --repository-names ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} \
            --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
            --image-tag-mutability-exclusion-filters 'filterType=WILDCARD,filter=latest'

          # Org-wide pull policy, the same one push-to-aws-ecr-repository and
          # the aws-infra pull-through templates apply. Without it the
          # repository is readable only from the registry's own account:
          # us-omega/us-omicron pull through a mirror with an infra-account
          # credential and never noticed, but the EU AWS clusters (their own
          # accounts, node IAM role) got 403 on every pull (issues-maestra#1031,
          # 2026-09-16). Set on every run, not only on create — the repository
          # already existed without it.
          aws ecr set-repository-policy --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} \
            --policy-text file://.github/ecr-policy.json >/dev/null

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build metadata
        id: meta
        run: |
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # BuildKit pushes only the layers ECR is missing; `docker push` from a
      # fresh daemon re-uploaded every layer of every release.
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
